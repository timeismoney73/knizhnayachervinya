<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f1eadc">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
    {% assign meta_image = page.image %}
    {% if page.layout != 'post' and meta_image == nil %}{% assign meta_image = '/assets/images/og.png' %}{% endif %}
    {% if meta_image %}<meta property="og:image" content="{{ meta_image | absolute_url }}">{% endif %}
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body class="{% if page.body_class %}{{ page.body_class }}{% endif %}">
    <a class="skip-link" href="#content">К содержанию</a>
    {% include header.html %}
    <main id="content">{{ content }}</main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
